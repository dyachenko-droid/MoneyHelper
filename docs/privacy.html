  facts: [["Առանց ինտերնետի","Հավելվածը ցանցից օգտվելու թույլտվություն չունի և չի կարող տվյալներ ուղարկել որևէ տեղ։"],["Առանց հաշվի","Գրանցում, էլ. փոստ կամ հեռախոսահամար պետք չէ։"],["Առանց գովազդի և վերլուծության","Ոչ մի հետագծիչ, գովազդային նույնացուցիչ կամ սխալների հավաքիչ։"],["Տվյալները մնում են ձեզ մոտ","Ամեն ինչ պահվում է հեռախոսում՝ հավելվածի փակ պահոցում։"]],
  s: [
    ["Ինչ է պահում հավելվածը", "Պահվում է միայն այն, ինչ դուք ինքներդ եք մուտքագրում, ձեր սարքում՝ հավելվածի փակ պահոցում․",
      ["հաշիվներ և դրանց մնացորդները","եկամուտներ և ծախսեր, կատեգորիաներ և ավտոկատեգորիայի կանոններ","բյուջեներ, խնայողական նպատակներ, պարտքեր և վարկեր","պարբերական վճարումներ և բաժանորդագրություններ","սկանավորված կտրոններ՝ ապրանքներ, գումարներ, ամսաթիվ և կտրոնի լուսանկար","կարգավորումներ՝ արժույթ, թեմա, հիշեցման ժամ և PIN-կոդ՝ միայն հեշի տեսքով"],
      "Android-ի ամպային պահուստավորումը հավելվածի համար անջատված է, ուստի տվյալները չեն պատճենվում Google-ի սերվերներ։"],
    ["Թույլտվություններ", null, null, null, [

      ["Կենսաչափություն","հավելվածը մատնահետքով կամ դեմքով բացելու համար, եթե դա միացրել եք։ Հավելվածը Android-ից ստանում է միայն «հաջող է / ոչ» պատասխանը և երբեք՝ կենսաչափական տվյալները։"],
      ["Թրթռոց","շոշափելի արձագանքի համար։"],
      ["Առաջադրանքների պլանավորում","ցանցի վիճակը, սարքն ակտիվ պահելը և վերագործարկումից հետո մեկնարկը անհրաժեշտ են WorkManager համակարգային բաղադրիչին, որպեսզի հիշեցումները ժամանակին գան։ Առանց ինտերնետի թույլտվության հավելվածը չի կարող օգտվել ցանցից։"]]],
    ["Փոխանցում երրորդ անձանց", "Հավելվածը չի վաճառում, չի փոխանցում և չի բացահայտում ձեր տվյալները։ Այն չունի գովազդ, վերլուծություն կամ տվյալներ հավաքող կողմնակի SDK-ներ։"],
    ["Արտահանում, պահուստային պատճեն և ներմուծում", "Ֆայլերը ստեղծվում են միայն ձեր հրամանով՝ CSV արտահանումը կամ պահուստային պատճենը պահվում են այնտեղ, որտեղ նշում եք ֆայլի ընտրության համակարգային պատուհանում, իսկ բանկային քաղվածքը ներմուծելիս կարդացվում է տեղում։ Դրանից հետո ֆայլը ձեր տնօրինության տակ է։"],
    ["Պահպանում և ջնջում", "Տվյալները պահվում են այնքան ժամանակ, մինչև դուք ինքներդ դրանք չջնջեք հավելվածում։ Հավելվածը հեռացնելիս կամ դրա տվյալները մաքրելիս ամեն ինչ անդառնալիորեն ջնջվում է։"],
    ["Երեխաներ", "Հավելվածը նախատեսված չէ 13 տարեկանից փոքր երեխաների համար և գիտակցաբար որևէ անձնական տվյալ չի հավաքում։"],
    ["Քաղաքականության փոփոխություններ", "Եթե քաղաքականությունը փոխվի, նոր տարբերակը կհրապարակվի այս էջում՝ նոր ամսաթվով։"],
    ["Կապ", "Գաղտնիության վերաբերյալ հարցերը կարող եք տալ՝ նախագծի պահոցում դիմում բացելով․"]
  ]},

ro: { name: "Română", cur: "MDL",

  updated: "În vigoare din 31 octombrie 2026",
  facts: [["Fără internet","Aplicația nu are permisiunea de acces la rețea și nu poate trimite date nicăieri."],["Fără cont","Nu sunt necesare înregistrare, e-mail sau număr de telefon."],["Fără reclame și analiză","Niciun tracker, identificator publicitar sau colector de erori."],["Datele rămân la dumneavoastră","Totul este păstrat în spațiul privat al aplicației pe telefon."]],

    ["Ce stochează aplicația", "Se salvează doar ceea ce introduceți dumneavoastră, în spațiul privat al aplicației de pe dispozitiv:",
      ["conturile și soldurile lor","veniturile și cheltuielile, categoriile și regulile de categorisire automată","bugetele, obiectivele de economisire, datoriile și creditele","plățile recurente și abonamentele","bonurile scanate: produse, sume, data și fotografia bonului","setările: moneda, tema, ora mementourilor și codul PIN — doar sub formă de hash"],
      "Copierea de rezervă în cloud a Android este dezactivată pentru aplicație, astfel încât datele nu sunt copiate pe serverele Google."],
    ["Permisiuni", null, null, null, [
      ["Cameră","pentru a citi codul QR de pe bon și a fotografia bonul. Imaginile sunt recunoscute direct pe dispozitiv de biblioteci integrate (scanerul de coduri ML Kit, Tesseract) și nu sunt încărcate nicăieri."],
      ["Notificări","pentru mementourile pe care le activați: despre înregistrarea zilnică și plățile apropiate."],
      ["Biometrie","pentru a deschide aplicația cu amprenta sau fața, dacă ați activat această opțiune. Aplicația primește de la Android doar răspunsul «reușit / nu», niciodată datele biometrice."],
      ["Vibrații","pentru răspuns tactil."],
      ["Planificarea sarcinilor","starea rețelei, menținerea dispozitivului activ și pornirea după repornire sunt necesare componentei de sistem WorkManager, pentru ca mementourile să sosească la timp. Fără permisiunea de internet, aplicația nu poate folosi rețeaua."]]],
    ["Transmiterea către terți", "Aplicația nu vinde, nu transmite și nu dezvăluie datele dumneavoastră. Nu conține reclame, analiză sau SDK-uri terțe care colectează date."],
    ["Export, copie de rezervă și import", "Fișierele sunt create doar la comanda dumneavoastră: exportul CSV sau copia de rezervă se salvează unde indicați în fereastra de sistem de alegere a fișierului, iar extrasul bancar este citit local la import. Ulterior, fișierul se află la dispoziția dumneavoastră."],
    ["Păstrare și ștergere", "Datele se păstrează până când le ștergeți în aplicație. La dezinstalarea aplicației sau ștergerea datelor ei, totul se șterge definitiv."],
    ["Copii", "Aplicația nu este destinată copiilor sub 13 ani și nu colectează în mod intenționat date personale."],
    ["Modificări ale politicii", "Dacă politica se modifică, noua versiune va fi publicată pe această pagină cu o dată nouă."],
    ["Contact", "Întrebările despre confidențialitate le puteți adresa deschizând o solicitare în depozitul proiectului:"]

    ["Saklamak we pozmak", "Maglumatlar olary programmada özüňiz pozýançaňyz saklanýar. Programma aýrylanda ýa-da onuň maglumatlary arassalananda hemme zat düýbünden pozulýar."],
    ["Çagalar", "Programma 13 ýaşdan kiçi çagalar üçin niýetlenmedik we hiç hili şahsy maglumatlary bilkastlaýyn ýygnamaýar."],
    ["Syýasatdaky üýtgeşmeler", "Syýasat üýtgese, täze görnüşi täze sene bilen şu sahypada çap ediler."],
    ["Habarlaşmak", "Gizlinlik barada soraglary taslamanyň repozitoriýasynda ýüztutma açyp berip bilersiňiz:"]
  ]}
};
const ORDER = ["ru","en","be","kk","uz","ky","tg","hy","az","ro","tk"];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function pick() {
  const q = new URLSearchParams(location.search).get("lang");
  if (q && L[q]) return q;
  try { const s = localStorage.getItem("privacy-lang"); if (s && L[s]) return s; } catch (e) {}
  for (const l of navigator.languages || [navigator.language || ""]) {
    const base = l.toLowerCase().split("-")[0];
    if (base === "mo") return "ro";
    if (L[base]) return base;
  }
  return "ru";
}

function render(code) {
  const t = L[code];
  document.documentElement.lang = code;
  document.title = "Денежный помощник — " + t.title;
  $("langName").textContent = t.name;
  $("title").textContent = t.title;
  $("lead").textContent = t.lead;
  $("updated").textContent = t.updated;
  $("facts").innerHTML = t.facts.map((f, i) =>
    '<div class="fact"><div class="ic">' + ICONS[i] + '</div><h3>' + esc(f[0]) + '</h3><p>' + esc(f[1]) + '</p></div>').join("");
  $("sections").innerHTML = t.s.map((s, i) => {
    let body = "";
    if (s[1]) body += "<p>" + esc(s[1]) + "</p>";
    if (s[2]) body += "<ul>" + s[2].map(x => "<li>" + esc(x) + "</li>").join("") + "</ul>";
    if (s[3]) body += "<p>" + esc(s[3]) + "</p>";
    if (s[4]) body += '<div class="perm">' + s[4].map(p => "<div><b>" + esc(p[0]) + "</b>" + esc(p[1]) + "</div>").join("") + "</div>";
    if (i === t.s.length - 1) body += '<p><a href="' + ISSUES + '" rel="noopener">' + ISSUES.replace("https://", "") + "</a></p>";
    return '<section><h2><span class="n">' + (i + 1) + "</span>" + esc(s[0]) + "</h2>" + body + "</section>";
  }).join("");
  $("langMenu").querySelectorAll("button").forEach(b => b.setAttribute("aria-selected", b.dataset.lang === code));
}

function setLang(code) {
  try { localStorage.setItem("privacy-lang", code); } catch (e) {}
  const u = new URL(location.href);
  u.searchParams.set("lang", code);
  history.replaceState(null, "", u);
  render(code);
}

const menu = $("langMenu"), btn = $("langBtn");
menu.innerHTML = ORDER.map(c =>
  '<button role="option" data-lang="' + c + '" lang="' + c + '"><span>' + esc(L[c].name) + '</span><span class="cur">' + L[c].cur + "</span></button>").join("");
function toggle(open) { menu.classList.toggle("open", open); btn.setAttribute("aria-expanded", open); }
btn.addEventListener("click", e => { e.stopPropagation(); toggle(!menu.classList.contains("open")); });
menu.addEventListener("click", e => { const b = e.target.closest("button"); if (b) { setLang(b.dataset.lang); toggle(false); btn.focus(); } });
document.addEventListener("click", () => toggle(false));
document.addEventListener("keydown", e => { if (e.key === "Escape") toggle(false); });
render(pick());
</script>
</body>
</html>
